<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM2.5 & DHT11 Smart Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0; color: #666; font-size: 14px; }
        .card .value { font-size: 28px; font-weight: bold; margin-top: 10px; color: #2c3e50; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Air Quality & Environment Dashboard</h1>
        
        <div class="cards">
            <div class="card">
                <h3>PM2.5</h3>
                <div class="value" id="latest-ug">-- <small style="font-size:14px;">ug/m³</small></div>
            </div>
            <div class="card">
                <h3>ระดับความหนาแน่น</h3>
                <div class="value" id="latest-percent">-- <small style="font-size:14px;">%</small></div>
            </div>
            <div class="card">
                <h3>อุณหภูมิ</h3>
                <div class="value" id="latest-temp">-- <small style="font-size:14px;">°C</small></div>
            </div>
            <div class="card">
                <h3>ความชื้น</h3>
                <div class="value" id="latest-hum">-- <small style="font-size:14px;">%</small></div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="sensorChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('sensorChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'PM2.5 (ug/m³)', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', fill: true, tension: 0.3 },
                    { label: 'อุณหภูมิ (°C)', data: [], borderColor: '#f39c12', backgroundColor: 'transparent', tension: 0.3 }
                ]
            },
            options: { responsive: true }
        });

        async function updateDashboard() {
            try {
                const response = await fetch('/api/pm25/history');
                const data = await response.json();

                if (data.length > 0) {
                    const latest = data[data.length - 1];
                    document.getElementById('latest-ug').innerText = latest.pm25_ug;
                    document.getElementById('latest-percent').innerText = latest.pm25_percent;
                    document.getElementById('latest-temp').innerText = latest.temp;
                    document.getElementById('latest-hum').innerText = latest.hum;

                    chart.data.labels = data.map(item => item.time);
                    chart.data.datasets[0].data = data.map(item => item.pm25_ug);
                    chart.data.datasets[1].data = data.map(item => item.temp);
                    chart.update();
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
